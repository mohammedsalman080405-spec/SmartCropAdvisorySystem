<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriAI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff7ef, #ffffff 40%, #edf8ee);
      padding: 1.5rem;
      font-family: "Inter", sans-serif;
    }
    .login-container {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.1);
      border: 1px solid #f1e6dc;
    }
    .logo {
      text-align: center;
      font-size: 2.7rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e76f51, #f4a261);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.35rem;
      font-family: "Playfair Display", serif;
    }
    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #525f7a;
      margin-bottom: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .form-input {
      width: 100%;
      padding: 0.95rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      font-size: 1rem;
      outline: none;
      transition: 0.2s ease;
      font-family: inherit;
    }
    .form-input:focus {
      border-color: #df8452;
      box-shadow: 0 0 0 3px rgba(223, 132, 82, 0.12);
    }
    .login-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #df8452, #e76f51);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .login-btn:disabled { opacity: 0.75; cursor: not-allowed; }
    .bottom-text {
      text-align: center;
      margin-top: 1.1rem;
      font-size: 0.95rem;
      color: #6b7280;
    }
    .bottom-text a { color: #df8452; text-decoration: none; font-weight: 700; }
    .msg {
      margin-top: 1rem;
      color: #d9534f;
      font-size: 0.95rem;
      text-align: center;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">AgriAI</div>
    <div class="subtitle">Welcome back. Login to continue.</div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="phone">Farmer Phone</label>
        <input type="tel" class="form-input" id="phone" name="phone" placeholder="+91 98765 43210" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-input" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Login</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="bottom-text">
      Don't have an account? <a href="/register" id="registerLink">Register</a>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("msg");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      loginBtn.disabled = true;
      msg.textContent = "Logging in...";

      try {
        const response = await fetch(`${API_BASE}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, password })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || "Login failed");

        localStorage.setItem("token", data.token);
        localStorage.setItem("farmerPhone", data.farmer.phone);
        localStorage.setItem("farmerName", data.farmer.name);
        localStorage.setItem("farmerVillage", data.farmer.village);

        msg.style.color = "#2d9061";
        msg.textContent = "Login successful. Redirecting...";
        setTimeout(() => { window.location.href = "/home"; }, 500);
      } catch (error) {
        msg.style.color = "#d9534f";
        msg.textContent = error.message || "Unable to login";
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
